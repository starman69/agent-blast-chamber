AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Agent Blast Chamber - decoy lab resources for the AWS shared-responsibility
  demonstration. Provisions FAKE/decoy resources and a scoped execution identity
  selected by SecurityProfile. Contains NO real secrets or production data.
  Everything is tagged Project=agent-blast-chamber for clean teardown.

Parameters:
  SecurityProfile:
    Type: String
    AllowedValues: [run1, run2, run3]
    Default: run1
    Description: >
      run1 = isolation only (over-privileged identity);
      run2 = isolation + least privilege;
      run3 = defense in depth (same IAM as run2; the guardrail and containment live
      in the separate run3-controls stack).
  ProjectTag:
    Type: String
    Default: agent-blast-chamber
    Description: Tag applied to every resource so teardown can find them.

Conditions:
  IsRun1: !Equals [!Ref SecurityProfile, run1]

Resources:

  ##########################################################################
  # Decoy data stores - all fake. Never place real data here.
  ##########################################################################
  DecoyBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectTag}-decoy-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: DataClass, Value: decoy-fake }

  DecoyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectTag}-decoy-customers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: DataClass, Value: decoy-fake }

  # Canary secret: value is obviously fake and is a tripwire, not a credential.
  CanarySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    Properties:
      Name: !Sub "${ProjectTag}/canary/decoy-api-key"
      Description: "CANARY - fake value, access is a tripwire signal. Not a real credential."
      SecretString: '{"note":"FAKE-CANARY-VALUE-NOT-A-REAL-SECRET","canary":true}'
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: DataClass, Value: canary }

  # The app's one legitimate dependency. Every profile may read it. In run3 it doubles as
  # the containment proof: after the canary trips, even this read is explicitly denied.
  AppConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectTag}/app/config"
      Type: String
      Value: '{"service":"orders-api","pool_size":50,"note":"decoy app config, not sensitive"}'
      Description: Decoy app config the agent's role legitimately needs.
      Tags:
        Project: !Ref ProjectTag

  ##########################################################################
  # Execution identity - the variable that changes across runs.
  # run1: over-privileged (broad access to the decoy resources).
  # run2/run3: least privilege (only the app's SSM parameter; everything else
  # is denied by default).
  ##########################################################################
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectTag}-agent-exec-${SecurityProfile}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            # The harness assumes this role (session name bc-<run>-<timestamp>) so every
            # probe is recorded in CloudTrail as the agent's own identity. Account root
            # means "principals in this account with sts:AssumeRole permission". Swap in
            # the AgentCore runtime principal when the agent runs on AgentCore.
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: sts:AssumeRole
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: SecurityProfile, Value: !Ref SecurityProfile }

  # Every profile: the app's legitimate need. sts:GetCallerIdentity needs no permission
  # (it always answers, even under an explicit deny) so it is not listed.
  AppAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: app-legitimate-access
      Roles: [!Ref AgentExecutionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AppConfigParameter}"

  # run1 only: intentionally over-privileged against the DECOY resources only.
  # run2/run3 simply don't get this policy - least privilege is deny-by-default, so any
  # denial CloudTrail records for them reads "no identity-based policy allows ...".
  OverPrivilegedPolicy:
    Type: AWS::IAM::Policy
    Condition: IsRun1
    Properties:
      PolicyName: over-privileged-decoy-access
      Roles: [!Ref AgentExecutionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:*
              - dynamodb:*
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            # Scoped to decoy resources so the lab cannot touch anything else,
            # while still modelling an "over-privileged" role for the demo.
            Resource:
              - !GetAtt DecoyBucket.Arn
              - !Sub "${DecoyBucket.Arn}/*"
              - !GetAtt DecoyTable.Arn
              - !Ref CanarySecret

Outputs:
  SecurityProfile:
    Value: !Ref SecurityProfile
  DecoyBucketName:
    Value: !Ref DecoyBucket
  DecoyObjectKey:
    Value: exports/customers.csv
  DecoyTableName:
    Value: !Ref DecoyTable
  CanarySecretArn:
    Value: !Ref CanarySecret
  AppConfigParameterName:
    Value: !Ref AppConfigParameter
  AgentExecutionRoleArn:
    Value: !GetAtt AgentExecutionRole.Arn
  AgentExecutionRoleName:
    Value: !Ref AgentExecutionRole
  Note:
    Value: >
      Decoy lab only. All data is fake. Evidence (trail, logs, dashboard) lives in the
      agent-blast-chamber-evidence stack; run3 guardrail + containment in
      agent-blast-chamber-run3-controls. See infra/cloudformation/README.md.
